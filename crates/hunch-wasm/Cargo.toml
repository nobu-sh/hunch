[package]
name = "hunch-wasm"
description = "wasm-bindgen wrapper around hunch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hunch-core = { workspace = true, features = ["serde"] }
serde = "1"
serde-wasm-bindgen = "0.6"
# Pinned: newer wasm-bindgen-cli releases need rustc > 1.86 to install with --locked.
wasm-bindgen = "=0.2.108"
