[package]
name = "hunch-core"
description = "Streaming key and BPM analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The JSON contract for estimates and session events, shared by the WASM bindings and the desktop app.
serde = ["dep:serde"]

[dependencies]
realfft = "3.5"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
