[package]
name = "hunch-desktop"
description = "Hunch desktop app: live key and BPM of what the computer is playing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hunch-capture.workspace = true
hunch-core = { workspace = true, features = ["serde"] }
# Pinned to 2.11: 2.12 needs rustc 1.90. Keep @tauri-apps/api and cli on the same minor.
tauri = { version = "~2.11", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
