[workspace]
resolver = "3"
members = [
    "crates/hunch-capture",
    "crates/hunch-core",
    "crates/hunch-wasm",
    "crates/hunch-eval",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
hunch-capture = { path = "crates/hunch-capture", default-features = false }
hunch-core = { path = "crates/hunch-core" }
